name: Build Windows Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build x64 Windows .exe (PyInstaller)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (Windows x64)
        # Note: scikit-learn>=1.3.0 and osmnx>=1.9.0 dependencies do not provide
        # 32-bit (win32) wheels on PyPI for modern Python; x64 (x86_64) is used.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build Windows application (--onedir) with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name step_counter `
            --paths . `
            --add-data "public;public" `
            --add-data "core/data.json;core" `
            --collect-data folium `
            --collect-data branca `
            --collect-data xyzservices `
            --collect-data certifi `
            --collect-all pyproj `
            --collect-all pyogrio `
            --copy-metadata osmnx `
            --collect-submodules sklearn.neighbors `
            --hidden-import PIL._tkinter_finder `
            app.py

      - name: Verify build output exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/step_counter/step_counter.exe")) {
            Write-Error "dist/step_counter/step_counter.exe was not created."
            exit 1
          }
          Get-Item "dist/step_counter/step_counter.exe" | Select-Object Name, Length
          Get-ChildItem "dist/step_counter" | Select-Object Name, Mode, Length

      - name: Upload build directory as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: step_counter-windows-x64
          path: dist/step_counter/
          if-no-files-found: error
          retention-days: 30
